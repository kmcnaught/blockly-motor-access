<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze</title>
    <link rel="stylesheet" href="maze.css">
  </head>
  <body>
  <div id="page-scale-wrapper">
    <div id="leftPadding" class="screen-padding left-padding"></div>
    <div class="main-content-wrapper">
    <header>
      <div class="zoom-controls" aria-label="Page zoom" data-msg-aria-label="MAZE_ZOOM_PANEL">
        <button id="zoomOutBtn" class="icon-button" title="Zoom out" aria-label="Zoom out" data-msg-title="MAZE_ZOOM_OUT" data-msg-aria-label="MAZE_ZOOM_OUT">−</button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button id="zoomInBtn" class="icon-button" title="Zoom in" aria-label="Zoom in" data-msg-title="MAZE_ZOOM_IN" data-msg-aria-label="MAZE_ZOOM_IN">+</button>
      </div>
      <h1 data-msg="MAZE_TITLE">Maze</h1>
      <div class="header-center">
        <span id="modeLabel" class="mode-label" data-msg="MAZE_MODE_CODING">Coding</span>
      </div>
      <div class="header-selectors">
        <button id="modeToggle" class="mode-toggle coding" aria-label="Toggle execution mode" data-msg-aria-label="MAZE_MODE_TOGGLE">
          <span id="modeAction" class="mode-action" data-msg="MAZE_SWITCH_TO_PRACTICE">Switch to Practice</span>
        </button>
        <div class="selector-group">
          <button id="pegmanButton"><img src="assets/pegman.png"><span>▼</span></button>
        </div>
        <button id="muteButton" class="mute-button" aria-label="Mute sound" aria-pressed="false" data-msg-aria-label="MAZE_MUTE">
          <span class="mute-icon sound-on">&#128266;</span>
          <span class="mute-icon sound-off">&#128263;</span>
        </button>
        <div class="selector-group">
          <select id="languageSelect">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
          </select>
        </div>
      </div>
    </header>

    <div id="instructionBar">
      <div class="instruction-content"><span id="levelInstruction"></span><span id="contextualHint"></span></div>
      <div class="stage-selector" id="stageSelector">
        <label for="stageDropdown" id="stageLabel">Stage:</label>
        <select id="stageDropdown" aria-label="Select stage" data-msg-aria-label="MAZE_STAGE_SELECT">
          <!-- Options populated dynamically by JavaScript -->
        </select>
      </div>
      <button id="infoBtn" class="info-btn" aria-label="Show keyboard shortcuts" data-msg-aria-label="MAZE_SHOW_SHORTCUTS">?</button>
    </div>

    <div class="container">
      <div class="blockly-container">
        <div id="blocklyDiv"></div>
        <div class="workspace-btns">
          <button id="deleteBlockBtn" class="clear-workspace-btn" data-msg="MAZE_DELETE_BLOCK">Delete block</button>
          <button id="clearWorkspaceBtn" class="clear-workspace-btn" data-msg="MAZE_CLEAR_WORKSPACE">Delete all</button>
        </div>

        <!-- Immediate Mode Panel (for levels 1-2) -->
        <div id="immediateModePanel" class="immediate-mode-panel hidden">
          <div class="immediate-hint"><span id="immediateHint"></span><img id="immediateMarker" class="immediate-marker" alt="goal" /></div>
          <div class="command-buttons">
            <button id="cmdForward" class="command-btn" aria-label="Move Forward" data-msg-aria-label="MAZE_PRACTICE_FORWARD">
              <span class="cmd-label" data-msg="MAZE_PRACTICE_FORWARD">Move Forward</span>
              <img class="cmd-icon" src="assets/steps.svg" alt="" width="24" height="24">
            </button>
            <button id="cmdTurnLeft" class="command-btn" aria-label="Turn Left" data-msg-aria-label="MAZE_PRACTICE_TURN_LEFT">
              <span class="cmd-label" data-msg="MAZE_PRACTICE_TURN_LEFT">Turn Left</span>
              <img class="cmd-icon" src="assets/turn_left.svg" alt="" width="24" height="24">
            </button>
            <button id="cmdTurnRight" class="command-btn" aria-label="Turn Right" data-msg-aria-label="MAZE_PRACTICE_TURN_RIGHT">
              <span class="cmd-label" data-msg="MAZE_PRACTICE_TURN_RIGHT">Turn Right</span>
              <img class="cmd-icon" src="assets/turn_right.svg" alt="" width="24" height="24">
            </button>
          </div>
          <div class="immediate-keyboard-hint">
            <span><kbd>↑</kbd> <span data-msg="MAZE_KEYHINT_FORWARD">forward</span></span>
            <span><kbd>←</kbd> <span data-msg="MAZE_KEYHINT_TURN_LEFT">turn left</span></span>
            <span><kbd>→</kbd> <span data-msg="MAZE_KEYHINT_TURN_RIGHT">turn right</span></span>
            <span><kbd>R</kbd> <span data-msg="MAZE_KEYHINT_RESET">reset</span></span>
          </div>
        </div>
      </div>

      <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle maze panel" data-msg-aria-label="MAZE_TOGGLE_PANEL">
        <span class="toggle-icon">›</span>
      </button>

      <div class="game-container">
        <div class="level-selector">
          <button id="prevLevel" data-msg="MAZE_PREV_LEVEL">&lt; Back</button>
          <span id="levelDisplay"></span>
          <button id="nextLevel" data-msg="MAZE_NEXT_LEVEL">Next &gt;</button>
        </div>

        <!-- Grid Mode Level Label (shown above maze in Grid mode) -->
        <div id="gridModeLevel" class="grid-mode-level hidden"></div>

        <!-- Grid Coding Mode Level Label -->
        <div id="gridCodingLevel" class="grid-coding-level hidden"></div>

        <div class="canvas-wrapper">
          <canvas id="mazeCanvas"></canvas>
          <!-- Level Banner (positioned over maze) -->
          <div id="levelBanner" class="level-banner">
            <span class="level-number"></span>
          </div>
          <!-- Confetti Container (positioned over maze) -->
          <div id="confettiContainer"></div>
          <!-- Fall Overlay (shown when character falls off in practice mode) -->
          <div id="fallOverlay" class="fall-overlay" aria-live="polite">
            <span id="fallOverlayText" class="fall-overlay-text"></span>
          </div>
        </div>

        <!-- Grid Mode Instruction Count (shown below maze in Grid mode) -->
        <div id="gridModeInstructionCount" class="grid-mode-instruction-count hidden"><span data-msg="MAZE_GRID_INSTRUCTIONS_LABEL">Instructions:</span> <span class="count">0</span></div>

        <!-- Grid Coding Mode Controls -->
        <div id="gridCodingControls" class="grid-coding-controls hidden">
          <span id="gridCodingBlockCount" class="grid-coding-block-count"><span data-msg="MAZE_GRID_BLOCKS_LABEL">Blocks:</span> <span class="count">0</span></span>
        </div>

        <div class="game-controls">
          <button id="runButton" data-msg="MAZE_RUN_PROGRAM">Run Program</button>
          <button id="ghostRunButton" class="hidden" data-msg="MAZE_GHOST_RUN_BUTTON">Ghost Run</button>
          <button id="resetButton" data-msg="MAZE_RESET_PROGRAM">Reset</button>
          <div id="capacityBubble" class="hidden"></div>
        </div>
      </div>
    </div>

    </div><!-- close main-content-wrapper -->

    <div id="rightPadding" class="screen-padding right-padding"></div>

    <!-- Control buttons positioned at page edges -->
    <!-- Left side: decrease («) at edge, increase (») moves out when both visible -->
    <button id="padLeftDecBtn" class="padding-control-btn pad-left-dec" aria-label="Decrease left padding" data-msg-aria-label="MAZE_PAD_LEFT_DEC">&laquo;</button>
    <button id="padLeftIncBtn" class="padding-control-btn pad-left-inc" aria-label="Increase left padding" data-msg-aria-label="MAZE_PAD_LEFT_INC">&raquo;</button>

    <!-- Right side: decrease (») at edge, increase («) moves out when both visible -->
    <button id="padRightDecBtn" class="padding-control-btn pad-right-dec" aria-label="Decrease right padding" data-msg-aria-label="MAZE_PAD_RIGHT_DEC">&raquo;</button>
    <button id="padRightIncBtn" class="padding-control-btn pad-right-inc" aria-label="Increase right padding" data-msg-aria-label="MAZE_PAD_RIGHT_INC">&laquo;</button>

    <div id="pegmanMenu"></div>
    <div id="hintDialog"><button class="close-btn">&times;</button><span id="hintText"></span></div>

    <!-- Result Modal (replaces alert boxes) -->
    <dialog id="resultModal" class="result-modal" aria-labelledby="resultModalTitle">
      <h2 id="resultModalTitle" class="result-modal-title"></h2>
      <p id="resultModalMessage" class="result-modal-message"></p>
      <p id="resultModalMessage2" class="result-modal-message"></p>
      <div class="result-modal-buttons">
        <button id="resultModalCancel" class="result-modal-cancel" hidden>
          <span class="cancel-text" data-msg="MAZE_CANCEL">Cancel</span>
          <span class="cancel-hint" data-msg="MAZE_KEY_ESC">[Esc]</span>
        </button>
        <button id="resultModalOk" class="result-modal-ok">
          <span class="ok-text" data-msg="MAZE_OK">OK</span>
          <span class="ok-hint" data-msg="MAZE_KEY_ENTER">[Enter]</span>
          <span class="ok-progress"></span>
        </button>
      </div>
    </dialog>

    <!-- Practice Mode Graduation Modal -->
    <dialog id="graduationModal" class="result-modal success" aria-labelledby="graduationModalTitle">
      <h2 id="graduationModalTitle" class="result-modal-title"></h2>
      <p id="graduationModalMessage" class="result-modal-message"></p>
      <div class="result-modal-buttons graduation-buttons">
        <button id="graduationTryCoding" class="result-modal-ok graduation-primary"></button>
        <button id="graduationStay" class="result-modal-ok graduation-secondary"></button>
      </div>
    </dialog>

    <!-- Confirmation Modal (for delete confirmation, etc.) -->
    <dialog id="confirmationModal" class="result-modal" aria-labelledby="confirmationModalTitle">
      <h2 id="confirmationModalTitle" class="result-modal-title"></h2>
      <p id="confirmationModalMessage" class="result-modal-message"></p>
      <div class="result-modal-buttons">
        <button id="confirmationModalCancel" class="result-modal-cancel" data-msg="MAZE_CANCEL">Cancel</button>
        <button id="confirmationModalConfirm" class="result-modal-ok" data-msg="MAZE_CONFIRM">Confirm</button>
      </div>
    </dialog>

    <!-- Stage Intro Modal -->
    <dialog id="stageIntroModal" class="result-modal stage-intro" aria-labelledby="stageIntroName">
      <h2 id="stageIntroName" class="result-modal-title stage-intro-name"></h2>
      <p id="stageIntroConcept" class="result-modal-message"></p>
      <div class="result-modal-buttons">
        <button id="stageIntroOk" class="result-modal-ok">
          <span class="ok-text" data-msg="MAZE_LETS_GO">Let's Go!</span>
          <span class="ok-hint" data-msg="MAZE_KEY_ENTER">[Enter]</span>
        </button>
      </div>
    </dialog>

    <!-- Grid Coding Intro Modal -->
    <dialog id="gridCodingIntroModal" class="result-modal stage-intro" aria-labelledby="gridCodingIntroTitle">
      <h2 id="gridCodingIntroTitle" class="result-modal-title stage-intro-name"></h2>
      <p id="gridCodingIntroLine1" class="result-modal-message"></p>
      <p id="gridCodingIntroLine2" class="result-modal-message"></p>
      <p id="gridCodingIntroLine3" class="result-modal-message"></p>
    </dialog>

    <!-- Grid Practice Intro Modal -->
    <dialog id="gridPracticeIntroModal" class="result-modal stage-intro" aria-labelledby="gridPracticeIntroTitle">
      <h2 id="gridPracticeIntroTitle" class="result-modal-title stage-intro-name"></h2>
      <p id="gridPracticeIntroLine1" class="result-modal-message"></p>
      <p id="gridPracticeIntroLine2" class="result-modal-message"></p>
      <p id="gridPracticeIntroLine3" class="result-modal-message"></p>
    </dialog>

    <!-- Shortcuts Info Modal -->
    <dialog id="shortcutsModal" class="result-modal shortcuts-modal" aria-labelledby="shortcutsModalTitle">
      <h2 id="shortcutsModalTitle" class="result-modal-title" data-msg="MAZE_SHORTCUTS_TITLE">Keyboard Shortcuts</h2>
      <div class="shortcuts-list">
        <div class="shortcut-item"><kbd>R</kbd> <span data-msg="MAZE_SHORTCUT_RUN">Run program</span></div>
        <div class="shortcut-item"><kbd>Shift</kbd>+<kbd>R</kbd> <span data-msg="MAZE_SHORTCUT_RESET">Reset maze position</span></div>
        <div class="shortcut-item"><kbd>[</kbd> <kbd>]</kbd> <span data-msg="MAZE_SHORTCUT_CHANGE_LEVELS">Change levels</span></div>
        <div class="shortcut-item"><kbd>H</kbd> <span data-msg="MAZE_SHORTCUT_TOGGLE_INSTRUCTIONS">Toggle instructions</span></div>
        <div class="shortcut-item"><kbd>,</kbd> <kbd>.</kbd> <span data-msg="MAZE_SHORTCUT_CHANGE_CHARACTER">Change character</span></div>
        <div class="shortcut-item"><kbd>L</kbd> <span data-msg="MAZE_SHORTCUT_CHANGE_LANGUAGE">Change language</span></div>
        <div class="shortcut-item"><kbd>Shift</kbd>+<kbd>M</kbd> <span data-msg="MAZE_SHORTCUT_MUTE">Mute/unmute</span></div>
      </div>
      <div class="settings-section">
        <h3 class="settings-heading" data-msg="MAZE_SETTINGS">Settings</h3>
        <div class="settings-group">
          <div class="setting-row">
            <label for="blockMovementSelect" data-msg="MAZE_SETTING_BLOCK_MOVEMENT">Rearrange blocks using</label>
            <select id="blockMovementSelect">
              <option value="both" data-msg="MAZE_BLOCK_MOVEMENT_BOTH">Drag or click</option>
              <option value="click-to-move" data-msg="MAZE_BLOCK_MOVEMENT_CLICK">Click-to-move</option>
              <option value="drag" data-msg="MAZE_BLOCK_MOVEMENT_DRAG">Drag</option>
            </select>
          </div>
          <div class="setting-row" id="highlightSizeRow">
            <label for="highlightSizeSelect" data-msg="MAZE_SETTING_HIGHLIGHT_SIZE">Connection highlight size</label>
            <select id="highlightSizeSelect">
              <option value="minimal" data-msg="MAZE_HIGHLIGHT_MINIMAL">Minimal</option>
              <option value="medium" data-msg="MAZE_HIGHLIGHT_MEDIUM">Medium</option>
              <option value="large" data-msg="MAZE_HIGHLIGHT_LARGE">Large</option>
            </select>
          </div>
        </div>
      </div>
      <div class="result-modal-buttons">
        <button id="deleteUserDataBtn" class="result-modal-cancel delete-data-btn" data-msg="MAZE_DELETE_ALL_DATA">Delete all saved data</button>
        <button id="shortcutsModalClose" class="result-modal-ok">
          <span class="ok-text" data-msg="MAZE_CLOSE">Close</span>
          <span class="ok-hint" data-msg="MAZE_KEY_ESC">[Esc]</span>
        </button>
      </div>
      <a href="https://kmcnaught.co.uk/block-coding/new-curriculum" target="_blank" rel="noopener" class="about-link" data-msg="MAZE_ABOUT">About</a>
    </dialog>

    <!-- Build SHA label -->
    <div id="build-sha" title="Build version"></div>

    <!-- Christmas Snow Effect Container -->
    <div id="snowContainer"></div>

  </div><!-- close page-scale-wrapper -->
  <!-- Blockly appends .blocklyDropDownDiv / .blocklyTooltipDiv / .blocklyWidgetDiv
       to document.body (here, outside the wrapper) at runtime -->
    <script src="bundle.js"></script>
  </body>
</html>
